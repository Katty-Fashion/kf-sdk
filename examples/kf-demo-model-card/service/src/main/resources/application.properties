spring.application.name=kf-demo-model-card
server.port=8080
# replaced at build time by Maven resource filtering (build.sh passes -Drevision=<version>)
module.version=@project.version@

# ---------------------------------------------------------------------------------------------------------------------
# The module's OWN database (the pattern of kf-feedback and KF-AAS-R3): the service `db` of docker-compose.yml, off the
# platform network. The passwords are files of the named volume db-credentials (written once by the service db-init),
# mounted read-only at /run/kfdemocard/ and read as properties by the config tree: `owner-password` (Flyway, the owner of
# the tables) and `app-password` (the application's role kfdemocard_app, which owns nothing and is bound by RLS).
# Neither is in the compose, neither derives from KF_HOOK_SECRET (rotated on repair, 214), both survive the rotations.
# ---------------------------------------------------------------------------------------------------------------------
spring.config.import=optional:configtree:/run/kfdemocard/
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/kfdemocard}
spring.datasource.username=kfdemocard_app
spring.datasource.password=${app-password:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.user=${KFDEMOCARD_DB_OWNER:kfdemocard}
spring.flyway.password=${owner-password:}
spring.flyway.locations=classpath:db/migration
# the application role's password, for CREATE ROLE in V1__baseline (never written in a file of the repository)
spring.flyway.placeholders.app_password=${app-password:}
